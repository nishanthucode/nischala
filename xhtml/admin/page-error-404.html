<script>
// Dynamic Notifications Inject
document.addEventListener('DOMContentLoaded', function() {
    var notifList = document.querySelector('.notification_dropdown .list-unstyled');
    if(notifList) {
        fetch('../backend/dashboard_api.php')
        .then(response => response.json())
        .then(data => {
            if(data && data.recentRegistrations) {
                let html = '';
                data.recentRegistrations.forEach(reg => {
                    html += '<li class="media dropdown-item"><span class="success" style="background: #99C83D; color: white; display: flex; align-items: center; justify-content: center; border-radius: 50%; width: 35px; height: 35px; margin-right: 15px;"><i class="la la-user"></i></span><div class="media-body"><a href="all-students.html" style="text-decoration: none;"><p style="margin-bottom: 0;"><strong>' + reg.name + '</strong> registered for <strong>' + (reg.class_name || 'a class') + '</strong></p></a></div></li>';
                });
                if(html === '') {
                    html = '<li class="media dropdown-item"><div class="media-body"><p>No recent registrations</p></div></li>';
                }
                notifList.innerHTML = html;
            }
        })
        .catch(err => console.error("Error loading notifications:", err));
    }
});
</script>
