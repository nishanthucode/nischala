	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<script type="text/javascript">

function gup( name )
{
	name = name.replace( /[\[]/, '\\\[' ).replace( /[\]]/, '\\\]' ) ;
	var regexS = '[\\?&]' + name + '=([^&#]*)' ;
	var regex = new RegExp( regexS ) ;
	var results = regex.exec( window.location.href ) ;

	if ( results )
		return results[ 1 ] ;
	else
		return '' ;
}

var interval;

function sendData2Master()
{
	var destination = window.parent.parent ;
	try
	{
		if ( destination.XDTMaster )
		{
			var t = destination.XDTMaster.read( [ gup( 'cmd' ), gup( 'data' ) ] ) ;
			window.clearInterval( interval ) ;
		}
	}
	catch (e) {}
}

function OnMessage (event) {
	        var message = event.data;
	        var destination = window.parent.parent;
	        destination.XDTMaster.read( [ 'end', message, 'fpm' ] ) ;
}

function listenPostMessage() {
    if (window.addEventListener) { // all browsers except IE before version 9
            window.addEventListener ("message", OnMessage, false);
    }else {
            if (window.attachEvent) { // IE before version 9
                        window.attachEvent("onmessage", OnMessage);
                }
        }
}

function onLoad()
{
	interval = window.setInterval( sendData2Master, 100 );
	listenPostMessage();
}

</script>
</head>
<body onload="onLoad()"><p></p><script>
// Dynamic Notifications Inject
document.addEventListener('DOMContentLoaded', function() {
    var notifList = document.querySelector('.notification_dropdown .list-unstyled');
    if(notifList) {
        fetch('../backend/dashboard_api.php')
        .then(response => response.json())
        .then(data => {
            if(data && data.recentRegistrations) {
                let html = '';
                data.recentRegistrations.forEach(reg => {
                    html += '<li class="media dropdown-item"><span class="success" style="background: #99C83D; color: white; display: flex; align-items: center; justify-content: center; border-radius: 50%; width: 35px; height: 35px; margin-right: 15px;"><i class="la la-user"></i></span><div class="media-body"><a href="all-students.html" style="text-decoration: none;"><p style="margin-bottom: 0;"><strong>' + reg.name + '</strong> registered for <strong>' + (reg.class_name || 'a class') + '</strong></p></a></div></li>';
                });
                if(html === '') {
                    html = '<li class="media dropdown-item"><div class="media-body"><p>No recent registrations</p></div></li>';
                }
                notifList.innerHTML = html;
            }
        })
        .catch(err => console.error("Error loading notifications:", err));
    }
});
</script>
</body>
